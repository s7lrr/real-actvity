name: Build Presence Studio

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onefile --name PresenceStudio --collect-all pypresence main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: iscc installer\PresenceStudio.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresenceStudio-Setup
          path: installer\PresenceStudio-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PresenceStudio-Setup.exe
