
name: Build Presence Studio Setup

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name PresenceStudio main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Setup
        shell: cmd
        run: iscc PresenceStudio.iss

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: PresenceStudio-Setup
          path: installer/PresenceStudio-Setup.exe

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PresenceStudio-Setup.exe
