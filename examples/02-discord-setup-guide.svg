<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" rx="26" fill="#10141c"/><text x="60" y="75" fill="#f5f7fb" font-family="Segoe UI,Arial" font-size="30" font-weight="700">Connect your Discord profile</text><text x="60" y="112" fill="#9aa6b7" font-family="Segoe UI,Arial" font-size="17">Complete these steps once before creating your first activity.</text>
<g font-family="Segoe UI,Arial"><rect x="60" y="160" width="510" height="440" rx="18" fill="#18212d" stroke="#354153"/><circle cx="110" cy="215" r="27" fill="#6479e8"/><text x="110" y="224" fill="white" font-size="23" text-anchor="middle" font-weight="700">1</text><text x="155" y="222" fill="#f5f7fb" font-size="22" font-weight="700">Create a Discord application</text><text x="95" y="280" fill="#c1cad6" font-size="16">Open the Developer Portal and choose</text><text x="95" y="308" fill="#c1cad6" font-size="16">New Application. Give it a name.</text><rect x="95" y="350" width="440" height="88" rx="12" fill="#0f151e" stroke="#3b485b"/><text x="120" y="385" fill="#8f9eb2" font-size="13" font-weight="700">GENERAL INFORMATION</text><text x="120" y="415" fill="#eef2f8" font-size="17">APPLICATION ID  •  Copy this value</text><text x="95" y="500" fill="#aab6c5" font-size="14">Paste the numeric ID into Presence Studio.</text><text x="95" y="545" fill="#8f9eb2" font-size="13">discord.com/developers/applications</text>
<rect x="630" y="160" width="510" height="440" rx="18" fill="#18212d" stroke="#354153"/><circle cx="680" cy="215" r="27" fill="#6479e8"/><text x="680" y="224" fill="white" font-size="23" text-anchor="middle" font-weight="700">2</text><text x="725" y="222" fill="#f5f7fb" font-size="22" font-weight="700">Upload your activity artwork</text><text x="665" y="280" fill="#c1cad6" font-size="16">In your application, open Rich Presence</text><text x="665" y="308" fill="#c1cad6" font-size="16">and add an image under Art Assets.</text><rect x="665" y="350" width="440" height="88" rx="12" fill="#0f151e" stroke="#3b485b"/><rect x="685" y="369" width="50" height="50" rx="8" fill="#39465a"/><text x="755" y="385" fill="#8f9eb2" font-size="13" font-weight="700">ASSET NAME / KEY</text><text x="755" y="413" fill="#eef2f8" font-size="17">game_cover</text><text x="665" y="500" fill="#aab6c5" font-size="14">Use the exact asset key in the app.</text><text x="665" y="545" fill="#8f9eb2" font-size="13">The local preview image is not uploaded.</text></g></svg>
